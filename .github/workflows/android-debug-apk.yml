name: Build CallWise AI Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CallWise AI zip
        run: unzip -o CallWiseAI-Android-v1.3.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: CallWiseAI
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: CallWiseAI
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallWiseAI-debug-apk
          path: CallWiseAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
